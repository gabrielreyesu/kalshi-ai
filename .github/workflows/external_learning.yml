name: External forecast research snapshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'kalshi_external/**'
      - '.github/workflows/external_learning.yml'
  schedule:
    - cron: '35 * * * *'

permissions:
  contents: read

concurrency:
  group: external-forecast-archive
  cancel-in-progress: false

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Choose lightweight hourly vs full research collection
        id: cadence
        shell: bash
        run: |
          utc_hour="$(date -u +%H)"
          if [[ "$GITHUB_EVENT_NAME" != "schedule" || "$utc_hour" == "01" || "$utc_hour" == "13" ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "Full historical/market collection: UTC $utc_hour"
          else
            echo "mode=hourly" >> "$GITHUB_OUTPUT"
            echo "Hour-ahead soccer and lineup monitoring only: UTC $utc_hour"
          fi
      - name: Restore rolling research cache
        uses: actions/cache@v4
        with:
          path: data/external_signals
          key: external-signals-v1-${{ github.run_id }}
          restore-keys: |
            external-signals-v1-
      - name: Restore durable private archive (optional; needs DATA_REPO_TOKEN)
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$DATA_REPO_TOKEN" ]; then echo "Sin DATA_REPO_TOKEN: solo caché temporal (no durable)."; exit 0; fi
          git clone -q --depth 1 "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${{ github.repository_owner }}/kalshi-ai-data.git" _archive
          mkdir -p data/external_signals _archive/external_signals
          python -m kalshi_external.archive merge data/external_signals/history.jsonl _archive/external_signals/history.jsonl data/external_signals/history.jsonl
          python -m kalshi_external.archive merge data/external_signals/weather.jsonl _archive/external_signals/weather.jsonl data/external_signals/weather.jsonl
          python -m kalshi_external.archive merge data/external_signals/player_injuries.jsonl _archive/external_signals/player_injuries.jsonl data/external_signals/player_injuries.jsonl
          python -m kalshi_external.archive merge data/external_signals/player_boxscores.jsonl _archive/external_signals/player_boxscores.jsonl data/external_signals/player_boxscores.jsonl
          python -m kalshi_external.archive merge data/external_signals/player_previews.jsonl _archive/external_signals/player_previews.jsonl data/external_signals/player_previews.jsonl
          python -m kalshi_external.archive merge data/external_signals/soccer_player_games.jsonl _archive/external_signals/soccer_player_games.jsonl data/external_signals/soccer_player_games.jsonl
          python -m kalshi_external.archive merge data/external_signals/soccer_lineups.jsonl _archive/external_signals/soccer_lineups.jsonl data/external_signals/soccer_lineups.jsonl
          python -m kalshi_external.archive merge data/external_signals/soccer_injuries.jsonl _archive/external_signals/soccer_injuries.jsonl data/external_signals/soccer_injuries.jsonl
          python -m kalshi_external.archive merge data/external_signals/soccer_previews.jsonl _archive/external_signals/soccer_previews.jsonl data/external_signals/soccer_previews.jsonl
          python -m kalshi_external.archive merge data/external_signals/soccer_confirmed_lineups.jsonl _archive/external_signals/soccer_confirmed_lineups.jsonl data/external_signals/soccer_confirmed_lineups.jsonl
          python -m kalshi_external.archive merge data/external_signals/soccer_starter_impact.jsonl _archive/external_signals/soccer_starter_impact.jsonl data/external_signals/soccer_starter_impact.jsonl
      - name: Snapshot time-stamped external forecasts
        if: steps.cadence.outputs.mode == 'full'
        env:
          KALSHI_RESOLVE_LIVE: "1"
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          LICENSED_ANALYST_FEED_URL: ${{ secrets.LICENSED_ANALYST_FEED_URL }}
          LICENSED_ANALYST_FEED_HOST: ${{ secrets.LICENSED_ANALYST_FEED_HOST }}
        run: python -m kalshi_external.cli --output reports/external_learning
      - name: Capture NOAA weather at verified outdoor NFL venues (no API key)
        if: steps.cadence.outputs.mode == 'full'
        run: python -m kalshi_external.nws_weather --output reports/external_learning/weather_status.json
      - name: Capture NBA NFL player injuries and completed player boxscores
        if: steps.cadence.outputs.mode == 'full'
        run: python -m kalshi_external.player_collect --output reports/external_learning/player_context
      - name: Generate pregame player availability and opponent context
        if: steps.cadence.outputs.mode == 'full'
        run: python -m kalshi_external.player_previews --output reports/external_learning/player_context/preview_coverage.json
      - name: Capture club and national soccer player statistics and available injury reports
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m kalshi_external.soccer_player_collect --mode "${{ steps.cadence.outputs.mode }}" --output reports/external_learning/soccer_players
      - name: Quantify soccer starter relevance, absences and possible replacements (research)
        run: python -m kalshi_external.soccer_impact_collect --output reports/external_learning/soccer_impact/coverage.json
      - name: Summarize trusted reference links and API coverage
        if: always()
        run: python -m kalshi_external.reference_report --output reports/external_learning/REFERENCIAS.md
      - name: Check research archive integrity before archival
        run: python -m kalshi_external.archive_audit --output reports/external_learning/archive_health.json
      - name: Verify private player archives (IDs, timestamps and boxscores)
        run: python -m kalshi_external.player_audit --output reports/external_learning/player_context/audit.json
      - name: Validate soccer player archives before private storage
        run: python -m kalshi_external.soccer_player_audit --output reports/external_learning/soccer_players/audit.json
      - name: Audit prospective soccer XI and starter importance before archival
        run: python -m kalshi_external.soccer_impact_audit --output reports/external_learning/soccer_impact/audit.json
      - name: Save durable private archive (optional)
        if: success()
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        run: |
          if [ -z "$DATA_REPO_TOKEN" ] || [ ! -d _archive ]; then exit 0; fi
          python -m kalshi_external.archive merge data/external_signals/history.jsonl _archive/external_signals/history.jsonl _archive/external_signals/history.jsonl
          python -m kalshi_external.archive merge data/external_signals/weather.jsonl _archive/external_signals/weather.jsonl _archive/external_signals/weather.jsonl
          python -m kalshi_external.archive merge data/external_signals/player_injuries.jsonl _archive/external_signals/player_injuries.jsonl _archive/external_signals/player_injuries.jsonl
          python -m kalshi_external.archive merge data/external_signals/player_boxscores.jsonl _archive/external_signals/player_boxscores.jsonl _archive/external_signals/player_boxscores.jsonl
          python -m kalshi_external.archive merge data/external_signals/player_previews.jsonl _archive/external_signals/player_previews.jsonl _archive/external_signals/player_previews.jsonl
          python -m kalshi_external.archive merge data/external_signals/soccer_player_games.jsonl _archive/external_signals/soccer_player_games.jsonl _archive/external_signals/soccer_player_games.jsonl
          python -m kalshi_external.archive merge data/external_signals/soccer_lineups.jsonl _archive/external_signals/soccer_lineups.jsonl _archive/external_signals/soccer_lineups.jsonl
          python -m kalshi_external.archive merge data/external_signals/soccer_injuries.jsonl _archive/external_signals/soccer_injuries.jsonl _archive/external_signals/soccer_injuries.jsonl
          python -m kalshi_external.archive merge data/external_signals/soccer_previews.jsonl _archive/external_signals/soccer_previews.jsonl _archive/external_signals/soccer_previews.jsonl
          python -m kalshi_external.archive merge data/external_signals/soccer_confirmed_lineups.jsonl _archive/external_signals/soccer_confirmed_lineups.jsonl _archive/external_signals/soccer_confirmed_lineups.jsonl
          python -m kalshi_external.archive merge data/external_signals/soccer_starter_impact.jsonl _archive/external_signals/soccer_starter_impact.jsonl _archive/external_signals/soccer_starter_impact.jsonl
          cd _archive
          git config user.name "kalshi-archive-bot"; git config user.email "kalshi-archive-bot@users.noreply.github.com"
          git add external_signals/history.jsonl external_signals/weather.jsonl external_signals/player_injuries.jsonl external_signals/player_boxscores.jsonl external_signals/player_previews.jsonl external_signals/soccer_player_games.jsonl external_signals/soccer_lineups.jsonl external_signals/soccer_injuries.jsonl external_signals/soccer_previews.jsonl external_signals/soccer_confirmed_lineups.jsonl external_signals/soccer_starter_impact.jsonl
          git diff --cached --quiet || git commit -q -m "external signals $(date -u +%FT%H:%MZ)"
          git push -q
      - name: Archive aggregate summaries only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-research-${{ github.run_number }}
          path: reports/external_learning/
          retention-days: 30
          if-no-files-found: warn
