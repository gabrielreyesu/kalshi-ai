name: Selecciones neutral-venue research

# Solo investigación: compara el motor de selecciones con la sede neutral de ESPN vs la inferida por torneo/anfitrión.
on:
  workflow_dispatch:
  push:
    branches: ['research/**']
    paths:
      - 'kalshi_intl/neutral.py'
      - '.github/workflows/intl_neutral_research.yml'

permissions:
  contents: read

jobs:
  neutral:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - name: Restore ESPN soccer results cache
        uses: actions/cache/restore@v4
        with:
          path: data/intl
          key: neutral-intl-v1-${{ github.run_id }}
          restore-keys: |
            neutral-intl-v1-
            intl-espn-v2-
            intl-data-
      - run: python -m kalshi_intl.neutral --output reports/intl_neutral
      - name: Save cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/intl
          key: neutral-intl-v1-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intl-neutral-${{ github.run_number }}
          path: reports/intl_neutral/
          retention-days: 30
