name: soccer-daily

on:
  schedule:
    - cron: "0 7 * * *"      # todos los días 07:00 UTC
  workflow_dispatch: {}        # también se puede lanzar a mano

permissions:
  contents: write              # para guardar el registro de predicciones en el repo

concurrency:
  group: soccer-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (si fallan, no se publica nada)
        run: python -m unittest discover -s tests
      - name: Evaluar partidos ya jugados
        run: python -m kalshi_soccer.cli evaluate
      - name: Predecir próximos 14 días
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python -m kalshi_soccer.cli predict --days 14
      - uses: actions/cache@v4
        with:
          path: data/intl
          key: intl-data-${{ github.run_id }}
          restore-keys: intl-data-
      - name: Copas europeas y selecciones (evaluar y predecir)
        run: |
          python -m kalshi_intl.cli evaluate
          python -m kalshi_intl.cli predict
      - name: Bajas de fútbol (API-Football; si falla no detiene el resto)
        continue-on-error: true
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m kalshi_intl.lesiones
      - name: Guardar registro (append-only, queda auditado en el historial de git)
        run: |
          git config user.name  "soccer-bot"
          git config user.email "soccer-bot@users.noreply.github.com"
          mkdir -p predictions
          python -m kalshi_nba.resumen
          git add predictions/ PREDICCIONES.md
          git diff --cached --quiet || git commit -m "predicciones $(date -u +%F)"
          git pull --rebase -q && git push
