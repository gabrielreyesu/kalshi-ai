name: pr-guard

# Los archivos generados (páginas y tabla) solo los escriben los bots en main. Si un PR los incluye, se producen
# conflictos en cuanto un bot los regenera. Este control falla y explica cómo corregirlo.
on:
  pull_request:

permissions:
  contents: read

jobs:
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: El PR no debe modificar archivos generados
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          bad=$(git diff --name-only "$base"...HEAD -- docs/index.html docs/progreso.html PREDICCIONES.md)
          if [ -n "$bad" ]; then
            echo "::error::Este PR modifica archivos generados por los bots: $bad"
            echo "Quítalos del PR (git checkout origin/main -- <archivo>). Se regeneran solos al fusionar (workflow pages-refresh)."
            exit 1
          fi
          echo "OK: el PR no toca archivos generados."
