name: NBA/NFL lineup-adjusted ratings research

# Solo investigación: descarga boxscores históricos de ESPN, construye variables de alineación sin fugas y compara
# contra nba_v1 en los mismos partidos fuera de muestra. No escribe en predictions/ ni toca producción.
on:
  workflow_dispatch:
  push:
    branches: ['research/**']
    paths:
      - 'kalshi_lineup/**'
      - '.github/workflows/lineup_research.yml'

permissions:
  contents: read

concurrency:
  group: lineup-research
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Tests (si fallan, no se evalúa)
        run: python -m pytest -q tests
      - name: Restore ESPN NBA cache (scoreboards, odds, boxscores)
        uses: actions/cache/restore@v4
        with:
          path: data/nba
          key: lineup-nba-v1-${{ github.run_id }}
          restore-keys: |
            lineup-nba-v1-
      - name: Restore ESPN NFL cache
        uses: actions/cache/restore@v4
        with:
          path: data/nfl
          key: lineup-nfl-v1-${{ github.run_id }}
          restore-keys: |
            lineup-nfl-v1-
      - name: NBA — walk-forward nba_v1 vs nba_v1 + lineup variables
        run: python -m kalshi_lineup.cli backtest --output reports/lineup
      - name: NFL — walk-forward nfl_v1 vs nfl_v1 + starting quarterback
        if: always()
        run: python -m kalshi_lineup.cli backtest-nfl --output reports/lineup
      - name: Save NBA cache even if a backtest failed (downloads are expensive)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/nba
          key: lineup-nba-v1-${{ github.run_id }}
      - name: Save NFL cache even if a backtest failed
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/nfl
          key: lineup-nfl-v1-${{ github.run_id }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-lineup-research-${{ github.run_number }}
          path: reports/lineup/
          retention-days: 30
          if-no-files-found: warn

  soccer:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        group: [clubes, selecciones]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore ESPN soccer results cache
        uses: actions/cache/restore@v4
        with:
          path: data/intl
          key: lineup-intl-v1-${{ matrix.group }}-${{ github.run_id }}
          restore-keys: |
            lineup-intl-v1-${{ matrix.group }}-
            intl-data-
            intl-espn-v2-
      - name: Restore ESPN soccer lineup cache
        uses: actions/cache/restore@v4
        with:
          path: data/intl_box
          key: lineup-intlbox-v1-${{ matrix.group }}-${{ github.run_id }}
          restore-keys: |
            lineup-intlbox-v1-${{ matrix.group }}-
      - name: Soccer — walk-forward intl model vs + starting XI (${{ matrix.group }})
        run: python -m kalshi_lineup.soccer_eval --group ${{ matrix.group }} --output reports/lineup
      - name: Save soccer caches even if the backtest failed
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/intl_box
          key: lineup-intlbox-v1-${{ matrix.group }}-${{ github.run_id }}
      - name: Save soccer results cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/intl
          key: lineup-intl-v1-${{ matrix.group }}-${{ github.run_id }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-xi-${{ matrix.group }}-${{ github.run_number }}
          path: reports/lineup/
          retention-days: 30
          if-no-files-found: warn
