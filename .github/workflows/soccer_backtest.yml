name: soccer-backtest

on:
  workflow_dispatch:
    inputs:
      first_test:
        description: "Primera temporada de prueba (código, ej. 2223)"
        default: "2223"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Backtest con datos reales
        run: python -m kalshi_soccer.cli backtest --first-test "${{ inputs.first_test }}"
      - name: Mostrar el reporte en el resumen de la corrida
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat reports/soccer_backtest_report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: soccer-backtest-reports
          path: reports/
