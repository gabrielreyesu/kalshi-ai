name: International model validation and candidate training

on:
  pull_request:
    paths:
      - '.github/workflows/intl_auto_validation.yml'
      - 'kalshi_intl/**'
      - 'tests/**'
      - 'requirements.txt'
  workflow_dispatch:
  schedule:
    - cron: '15 10 * * 1'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run full test suite (no external sports data required)
        run: python -m pytest -q tests

  evaluate:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore historical ESPN cache
        uses: actions/cache@v4
        with:
          path: data/intl
          key: intl-espn-v2-${{ github.run_id }}
          restore-keys: |
            intl-espn-v2-
      - name: Rebuild historical walk-forward evaluations
        run: python -m kalshi_intl.evaluate_history --cache data/intl --first-year 2016 --output reports/intl_real_validation
      - name: Compare original and challenger against historical outcomes
        run: python -m kalshi_intl.auto_validate --input reports/intl_real_validation/oos_paired.csv --output reports/intl_auto_validation
      - name: Benchmark fixed candidate families on prior-season walk-forward data
        run: python -m kalshi_intl.experiments --input reports/intl_real_validation/oos_raw.csv --output reports/intl_experiments
      - name: Retrain a JSON candidate only with completed prior-UTC-day matches
        run: python -m kalshi_intl.auto_train --input reports/intl_real_validation/oos_raw.csv --output reports/intl_training/calibrator_candidate.json
      - name: Restore rolling external research archive
        uses: actions/cache@v4
        with:
          path: data/external_signals
          key: external-signals-v1-${{ github.run_id }}
          restore-keys: |
            external-signals-v1-
      - name: Measure externally sourced forecast skill on completed international matches
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          LICENSED_ANALYST_FEED_URL: ${{ secrets.LICENSED_ANALYST_FEED_URL }}
          LICENSED_ANALYST_FEED_HOST: ${{ secrets.LICENSED_ANALYST_FEED_HOST }}
        run: python -m kalshi_external.cli --output reports/external_learning
      - name: Archive validation and training artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: international-model-research-${{ github.run_number }}
          path: reports/intl_*/
          if-no-files-found: warn
          retention-days: 30
